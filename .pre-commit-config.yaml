repos:
  - repo: local
    hooks:
      - id: vocabulary
        name: no organization-specific vocabulary
        entry: python3 scripts/check_vocabulary.py
        language: system
        pass_filenames: true
        always_run: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
